<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>MLTI：现代文学人格测试</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* 样式与之前完全一致，为节省篇幅此处省略，实际使用请复制之前完整样式 */
        :root {
            --bg: #fef7e8;
            --card: #ffffff;
            --text: #3e2a21;
            --sub: #7a5a3a;
            --accent: #b88b4a;
            --light: #f5ede0;
            --border: #e9d9c2;
        }
        [dark-mode="on"] {
            --bg: #1a1611;
            --card: #2a241c;
            --text: #e9dfc7;
            --sub: #c2b49c;
            --accent: #d49a5f;
            --light: #5c4b36;
            --border: #554634;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; transition: background 0.3s, color 0.2s, border-color 0.3s; }
        body { background: var(--bg); font-family: 'Noto Serif SC', serif; color: var(--text); line-height: 1.5; }
        .dark-toggle { position: fixed; top: 16px; right: 16px; background: var(--accent); color: #fff; border: none; width: 44px; height: 44px; border-radius: 50%; font-size: 20px; cursor: pointer; z-index: 999; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .app-container { max-width: 1200px; margin: 0 auto; padding: 24px 20px 60px; }
        .intro-section { transition: opacity 0.3s ease; }
        .intro-section.hide { display: none; }
        .hero { text-align: center; margin-bottom: 48px; padding: 24px 20px 32px; background: linear-gradient(135deg, #fff6ea, #fff9f0); border-radius: 48px; }
        [dark-mode="on"] .hero { background: #2f2820; }
        .hero h1 { font-size: 2rem; font-weight: 700; color: var(--accent); margin-bottom: 12px; }
        .hero-sub { font-size: 0.95rem; color: var(--sub); border-top: 1px solid var(--border); display: inline-block; padding-top: 8px; }
        .start-test-btn { background: var(--accent); color: white; border: none; padding: 14px 36px; font-size: 1.1rem; border-radius: 48px; cursor: pointer; margin-top: 20px; }
        .dimensions-showcase { margin: 48px 0 56px; }
        .section-title { font-size: 1.6rem; font-weight: 600; text-align: center; color: var(--accent); margin-bottom: 32px; }
        .dim-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
        .dim-card { background: var(--card); border-radius: 28px; padding: 20px; border: 1px solid var(--border); }
        .dim-name { font-size: 1.2rem; font-weight: 700; color: var(--accent); margin-bottom: 12px; display: flex; gap: 8px; }
        .dim-badge { background: var(--light); padding: 4px 12px; border-radius: 40px; font-size: 0.65rem; }
        .dim-scale { background: var(--light); border-radius: 20px; padding: 12px 16px; margin: 12px 0; display: flex; justify-content: space-between; font-size: 0.8rem; }
        .dim-desc { font-size: 0.85rem; color: var(--sub); }
        .writers-gallery { margin: 48px 0 40px; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 16px; }
        .writer-card { background: var(--card); border-radius: 16px; padding: 14px 8px; text-align: center; border: 1px solid var(--border); }
        .writer-avatar { width: 80px; height: 80px; margin: 0 auto 10px; border-radius: 12px; overflow: hidden; border: 2px solid var(--border); background: var(--light); }
        .writer-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .writer-name { font-weight: 600; font-size: 0.85rem; }
        .writer-tag { font-size: 0.6rem; color: var(--accent); margin-top: 4px; }
        .test-section { display: none; }
        .test-section.active { display: block; }
        .progress-area { background: var(--light); padding: 12px 20px 8px; border-radius: 40px; margin-bottom: 24px; }
        .progress-thermal { background: var(--border); height: 10px; border-radius: 20px; }
        .progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, var(--accent), #e0a56e); border-radius: 20px; }
        .progress-msg { display: flex; justify-content: space-between; margin-top: 8px; font-size: 0.7rem; color: var(--sub); }
        .question-area { background: var(--card); border-radius: 32px; padding: 28px 26px; border: 1px solid var(--border); }
        .step-counter { font-size: 0.7rem; color: var(--sub); border-left: 2px solid var(--accent); padding-left: 12px; margin-bottom: 12px; }
        .dimension-badge { background: var(--light); color: var(--sub); font-size: 0.75rem; padding: 4px 14px; border-radius: 24px; display: inline-block; margin-bottom: 16px; }
        .scenario { background: var(--light); padding: 14px; border-left: 4px solid var(--accent); margin: 16px 0; border-radius: 8px; }
        .question-text { font-size: 1rem; font-weight: 600; margin: 12px 0; }
        .option-btn { background: var(--card); border: 1px solid var(--border); padding: 14px; margin-bottom: 10px; border-radius: 28px; cursor: pointer; }
        .option-btn.selected { background: var(--light); border-color: var(--accent); }
        .nav-buttons { display: flex; gap: 16px; margin-top: 24px; }
        .nav-btn { flex: 1; padding: 12px; border-radius: 40px; border: 1px solid var(--border); background: var(--light); cursor: pointer; font-weight: 500; }
        .nav-btn.primary { background: var(--accent); color: white; border: none; }
        .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .result-container { text-align: center; }
        .portrait { width: 120px; height: 120px; margin: 0 auto 16px; border-radius: 16px; overflow: hidden; border: 3px solid var(--border); }
        .result-writer { font-size: 1.8rem; font-weight: 800; }
        .result-tag { font-size: 1rem; color: var(--accent); }
        .result-badge { background: var(--light); padding: 6px 16px; border-radius: 30px; display: inline-block; font-size: 0.8rem; }
        .six-dim { background: var(--light); border-radius: 28px; padding: 16px; margin: 16px 0; text-align: left; }
        .dim-item { margin-bottom: 16px; }
        .dim-labels { display: flex; justify-content: space-between; font-size: 0.7rem; }
        .progress-bar-container { background: var(--border); border-radius: 20px; height: 8px; margin: 6px 0; }
        .progress-fill-bar { background: var(--accent); height: 100%; border-radius: 20px; }
        .dim-percent { font-size: 0.65rem; color: var(--accent); text-align: right; }
        .action-buttons { display: flex; gap: 12px; justify-content: center; margin-top: 20px; }
        .share-btn, .restart-btn { padding: 10px 24px; border-radius: 40px; border: none; cursor: pointer; font-size: 0.85rem; }
        .share-btn { background: var(--light); color: var(--text); border: 1px solid var(--border); }
        .restart-btn { background: var(--accent); color: white; }
        .toast-msg { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 8px 20px; border-radius: 40px; z-index: 2000; animation: fadeOut 2s forwards; }
        @keyframes fadeOut { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
        .footer-note { text-align: center; margin-top: 32px; font-size: 0.7rem; color: var(--sub); }
        .fade-in { animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
<button class="dark-toggle" id="darkToggle">🌙</button>
<div class="app-container" id="appContainer">
    <div id="introSection" class="intro-section">
        <div class="hero">
            <h1>📜 MLTI：现代文学人格测试</h1>
            <div class="hero-sub">六维坐标 · 文学人格</div>
            <button id="globalStartBtn" class="start-test-btn">✨ 开始测试 ✨</button>
        </div>
        <div class="dimensions-showcase">
            <div class="section-title">📐 灵魂六维 · 测度文心</div>
            <div class="dim-grid" id="dimGrid"></div>
        </div>
        <div class="writers-gallery">
            <div class="section-title">🖋️ 十六位作家群像</div>
            <div class="gallery-grid" id="writersGallery"></div>
        </div>
        <div class="footer-note">选择你的倾向，匹配属于你的文学人格</div>
    </div>
    <div id="testSection" class="test-section">
        <div class="progress-area">
            <div class="progress-thermal"><div class="progress-fill" id="progressFill"></div></div>
            <div class="progress-msg">
                <span>📜 灵魂六维 · 民国文气</span>
                <span id="progressText">未开始</span>
            </div>
        </div>
        <div id="dynamicContent"></div>
        <div class="footer-note">文学人格 · 六维最近邻匹配</div>

</div>

        {"dim":"form","text":"文学课老师布置了一次日常小作业，没有严格的格式要求。","q":"你会？","opts":[{"val":0,"title":"按常规格式","fun":"规矩就是规矩，按标准来"},{"val":1,"title":"在框架内发挥","fun":"带着镣铐跳舞，适当创新"},{"val":2,"title":"按自己逻辑","fun":"内容比形式重要，按我的来"}]},
        {"dim":"form","text":"你喜欢的UP主尝试了一种全新的视频风格，评论区有人说“变味了”。","q":"你觉得？","opts":[{"val":0,"title":"怀念旧风格","fun":"旧风格更亲切，新风格不太适应"},{"val":1,"title":"风格各有趣","fun":"新风格有亮点，旧风格也有味道"},{"val":2,"title":"支持创新","fun":"永远在路上，支持突破与创新"}]},
        {"dim":"culture","text":"你正在装修自己的房间，你更倾向于？","q":"你更倾向于？","opts":[{"val":0,"title":"最常规的家居装修风格","fun":"安全第一，不出错"},{"val":1,"title":"小范围尝试一些新风格，比如复古风等","fun":"在细节里加点趣味"},{"val":2,"title":"我的房间必须别具一格，尝试大范围使用奇特的风格","fun":"大胆实验，独一无二"}]},
        {"dim":"culture","text":"你刷到一篇文章说“年轻人应该多读传统文化经典，少读外国翻译文学”。","q":"你会？","opts":[{"val":0,"title":"认同传统优先","fun":"有道理，根不能丢，先把老祖宗吃透"},{"val":1,"title":"主张兼收并蓄","fun":"各有所长，不要二极管"},{"val":2,"title":"偏向世界文学","fun":"太保守了，好作品不分国界，文学是世界语"}]},
        {"dim":"culture","text":"你觉得现代华语文学最应该向谁学习？","q":"你觉得最应该向谁学习？","opts":[{"val":0,"title":"中国古典","fun":"从《红楼梦》、唐宋八大家里找灵感"},{"val":1,"title":"中西结合","fun":"东西方都看，但要写中国人的事"},{"val":2,"title":"世界文学","fun":"重视卡夫卡、马尔克斯、博尔赫斯"}]},
        {"dim":"culture","text":"如果让你选一句人生格言，你更倾向？","q":"你更倾向？","opts":[{"val":0,"title":"圣人为腹不为目，故去彼取此。","fun":"向内扎根"},{"val":1,"title":"万物皆可入诗，只要你敢凝视它。","fun":"意义，由我自决"},{"val":2,"title":"你已飞渡万重的山头／去更阔大的湖海投射影子","fun":"逐浪，向世界"}]},
        {"dim":"function","text":"你觉得作家最不应该丢弃的是什么？","q":"你觉得作家最不应该丢弃的是什么？","opts":[{"val":0,"title":"批判的勇气","fun":"为沉默者发声，文以载道"},{"val":1,"title":"对人的共情","fun":"看见具体的人，在风花雪月里也称重现实"},{"val":2,"title":"独特的审美","fun":"保持艺术的独立性，灵魂裸奔才叫诚恳"}]},
        {"dim":"function","text":"当你读到一篇写得很美但“不关心社会”的纯抒情散文时，你会觉得？","q":"你会觉得？","opts":[{"val":0,"title":"入世优先","fun":"有点可惜，好文笔该写更有意义的事"},{"val":1,"title":"多元共赏","fun":"挺好的，文学本来就有不同功能，百花齐放"},{"val":2,"title":"审美至上","fun":"很珍贵，纯文学的审美价值就在这里"}]},
        {"dim":"function","text":"你更欣赏哪种文学批评？","q":"你更欣赏哪种？","opts":[{"val":0,"title":"这作品对时代有用吗？能带来进步吗？","fun":"文以载道，质检员上线"},{"val":1,"title":"美是重要的，但若能多一些现实的重量，会更沉。","fun":"在风花雪月里也要称重"},{"val":2,"title":"别谈高大的意义，我只在乎写作者有没有交出真正的自己。","fun":"灵魂裸奔，才叫诚恳"}]},
        {"dim":"function","text":"你觉得文学史上的“左翼文学”最大的价值是什么？","q":"你觉得最大的价值是什么？","opts":[{"val":0,"title":"直接介入社会","fun":"让文学直接参与改变社会，有血性"},{"val":1,"title":"记录底层现实","fun":"记录了那个时代底层人民的真实处境，历史的底稿"},{"val":2,"title":"激发形式探索","fun":"激发了新的创作方法与题材，丰富了文学可能性"}]}
    ];

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }
    const questions = shuffleArray([...rawQuestions]);

    function getDimensionDisplay(dimKey) {
        const map = { "character": "① 性格","style": "② 文字风格","orientation": "③ 文学取向","form": "④ 形式态度","culture": "⑤ 文化立场","function": "⑥ 文学功能" };
        return map[dimKey];
    }

    let currentIndex = 0;
    let userAnswers = new Array(questions.length).fill(null);
    let testStarted = false;
    let finalUserVec = [];
    let currentResultName = "";
    let currentFitPercent = 0;
    const dynamicDiv = document.getElementById("dynamicContent");
    const progressFill = document.getElementById("progressFill");
    const progressTextSpan = document.getElementById("progressText");

    function showToast(msg) {
        let t = document.createElement('div');
        t.className = 'toast-msg';
        t.innerText = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2000);
    }

    function shareResult() {
        const shareURL = "https://wanhudaoyisheng.github.io/MLTI.com.cn/";
        const shareText = `【MLTI：现代文学人格测试】我的文学人格是「${currentResultName}」${writerTag[currentResultName]}，契合度 ${currentFitPercent}%！\n“${writerDesc[currentResultName].slice(0, 70)}...”\n测测你是哪位民国作家？ ${shareURL}`;
        if (navigator.clipboard) {
            navigator.clipboard.writeText(shareText).then(() => showToast("✓ 文案已复制！")).catch(() => fallbackCopy(shareText));
        } else {
            fallbackCopy(shareText);
        }
    }

    function fallbackCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast("✓ 文案已复制");
    }

    function updateProgress() {
        if (!testStarted) {
            progressFill.style.width = "0%";
            progressTextSpan.innerText = "未开始";
            return;
        }
        const answered = userAnswers.filter(x => x !== null).length;
        const pct = (answered / questions.length) * 100;
        progressFill.style.width = pct + "%";
        if (answered === 0) progressTextSpan.innerText = "📭 尚未落笔";
        else if (answered < 8) progressTextSpan.innerText = `✍️ 已答 ${answered} 题 · 墨迹初显`;
        else if (answered < 18) progressTextSpan.innerText = `📜 已答 ${answered} 题 · 文心渐明`;
        else if (answered < questions.length) progressTextSpan.innerText = `🎋 已答 ${answered} 题 · 即将破茧`;
        else progressTextSpan.innerText = "⚡ 全部答完 · 查看结果";
    }

    function renderCurrentQuestion() {
        const q = questions[currentIndex];
        const sel = userAnswers[currentIndex];
        const dimDisplay = getDimensionDisplay(q.dim);
        let optsHTML = "";
        q.opts.forEach(opt => {
            const c = sel === opt.val ? "selected" : "";
            optsHTML += `<div class="option-btn ${c}" data-val="${opt.val}"><div style="font-weight:bold;">${opt.title}</div><div style="font-size:0.8rem;">${opt.fun}</div></div>`;
        });
        dynamicDiv.innerHTML = `
            <div class="question-area fade-in">
                <div class="step-counter">第 ${currentIndex+1} / ${questions.length} 题</div>
                <div class="dimension-badge">📌 ${dimDisplay}</div>
                <div class="scenario">${q.text}</div>
                <div class="question-text">${q.q}</div>
                ${optsHTML}
                <div class="nav-buttons">
                    <button class="nav-btn" id="prevBtn" ${currentIndex===0 ? "disabled" : ""}>上一题</button>
                    <button class="nav-btn primary" id="nextBtn">${currentIndex===questions.length-1 ? "生成结果" : "下一题"}</button>
                </div>
            </div>
        `;
        document.querySelectorAll(".option-btn").forEach(btn => {
            btn.onclick = () => {
                userAnswers[currentIndex] = parseInt(btn.dataset.val);
                document.querySelectorAll(".option-btn").forEach(b => b.classList.remove("selected"));
                btn.classList.add("selected");
                updateProgress();
            };
        });
        document.getElementById("prevBtn").onclick = () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderCurrentQuestion();
            }
        };
        document.getElementById("nextBtn").onclick = () => {
            if (userAnswers[currentIndex] === null) {
                alert("请选择一个选项再继续～");
                return;
            }
            if (currentIndex === questions.length - 1) {
                computeAndShowResult();
            } else {
                currentIndex++;
                renderCurrentQuestion();
            }
        };
    }

    // 确定性最近邻匹配
    async function computeAndShowResult() {
        dynamicDiv.innerHTML = `<div style="text-align:center; padding:60px;">正在生成文学人格...</div>`;
        await new Promise(r => setTimeout(r, 500));

        const dimSums = { orientation: 0, character: 0, style: 0, form: 0, culture: 0, function: 0 };
        const dimCounts = { orientation: 0, character: 0, style: 0, form: 0, culture: 0, function: 0 };
        for (let i = 0; i < questions.length; i++) {
            const dim = questions[i].dim;
            dimSums[dim] += userAnswers[i];
            dimCounts[dim]++;
        }
        finalUserVec = [
            dimSums.orientation / dimCounts.orientation,
            dimSums.character / dimCounts.character,
            dimSums.style / dimCounts.style,
            dimSums.form / dimCounts.form,
            dimSums.culture / dimCounts.culture,
            dimSums.function / dimCounts.function
        ];

        let bestWriter = null;
        let minDist = Infinity;
        for (const [name, coords] of Object.entries(writersData)) {
            let d = 0;
            for (let i = 0; i < 6; i++) d += Math.pow(finalUserVec[i] - coords[i], 2);
            const dist = Math.sqrt(d);
            if (dist < minDist) {
                minDist = dist;
                bestWriter = name;
            }
        }
        showResult(bestWriter, minDist);
    }

    function showResult(name, dist) {
        currentResultName = name;
        currentFitPercent = Math.min(95, Math.max(40, Math.round(100 - dist * 18)));
        const img = writerPortrait[name];
        const rec = writerRecommend[name];
        const dimConfig = [
            { left: "❄️ 冷峻克制", right: "🔥 情感浓烈" },
            { left: "📝 写实求真", right: "🎨 写意抒情" },
            { left: "🌍 介入社会", right: "🌙 退守内心" },
            { left: "🏛️ 守章法", right: "✨ 创新破格" },
            { left: "🏯 亲传统", right: "🗽 亲外来" },
            { left: "⚡ 载道入世", right: "🍃 言志抒情" }
        ];
        let dimHtml = '';
        for (let i = 0; i < 6; i++) {
            const percent = Math.round((finalUserVec[i] / 2) * 100);
            dimHtml += `
                <div class="dim-item">
                    <div class="dim-labels"><span>${dimConfig[i].left}</span><span>${dimConfig[i].right}</span></div>
                    <div class="progress-bar-container"><div class="progress-fill-bar" style="width:${percent}%;"></div></div>
                    <div class="dim-percent">${percent}%</div>
                </div>
            `;
        }
        dynamicDiv.innerHTML = `
            <div class="question-area result-container fade-in">
                <div class="step-counter">文学人格结果</div>
                <div class="portrait"><img src="${img}" onerror="this.src='https://via.placeholder.com/120?text=📖'" style="width:100%;height:100%;object-fit:cover;"></div>
                <div class="result-writer">${name}</div>
                <div class="result-tag">${writerTag[name]}</div>
                <div class="result-badge">人格契合度 ${currentFitPercent}%</div>
                <div class="six-dim"><div style="font-weight:bold; margin-bottom:12px;">📊 你的六维气质图谱</div>${dimHtml}</div>
                <div class="result-desc">${writerDesc[name]}<div style="margin-top:16px; border-top:1px dotted var(--border); padding-top:12px;">📚 推荐阅读：${rec.work}<br>✍️ ${rec.quote}</div></div>
                <div class="action-buttons">
                    <button class="share-btn" id="shareResultBtn">📤 分享结果</button>
                    <button class="restart-btn" id="restartFromResultBtn">🔄 重新测试</button>
                </div>
            </div>
        `;
        document.getElementById("shareResultBtn")?.addEventListener("click", shareResult);
        document.getElementById("restartFromResultBtn")?.addEventListener("click", () => {
            document.getElementById("testSection").classList.remove("active");
            document.getElementById("introSection").classList.remove("hide");
            testStarted = false;
        });
        progressFill.style.width = "100%";
        progressTextSpan.innerText = "文格已现";
    }

    function startTest() {
        document.getElementById("introSection").classList.add("hide");
        document.getElementById("testSection").classList.add("active");
        testStarted = true;
        currentIndex = 0;
        userAnswers.fill(null);
        updateProgress();
        renderCurrentQuestion();
    }

    renderIntro();
    document.getElementById("globalStartBtn").addEventListener("click", startTest);
    window.renderStartPage = startTest;
</script>
